<div class="container my-5">
    <h2 class="text-center">Payment Page</h2>
    <div class="payment-form-wrapper mx-auto mt-4">
      <form #paymentForm="ngForm" (ngSubmit)="onPaymentSuccess()">
        <div class="mb-3">
          <label for="cardNumber" class="form-label">Card Number</label>
          <input type="text" id="cardNumber" class="form-control" placeholder="1234 5678 9012 3456" required>
        </div>
  
        <div class="mb-3 d-flex justify-content-between">
          <div class="w-50 me-2">
            <label for="expiryDate" class="form-label">Expiry Date</label>
            <input type="text" id="expiryDate" class="form-control" placeholder="MM/YY" required>
          </div>
          <div class="w-50 ms-2">
            <label for="cvv" class="form-label">CVV</label>
            <input type="password" id="cvv" class="form-control" placeholder="123" required>
          </div>
        </div>
  
        <button class="btn btn-success w-100" type="submit">Pay Now</button>
      </form>
    </div>
  </div>
